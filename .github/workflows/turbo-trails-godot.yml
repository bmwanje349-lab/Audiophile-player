name: Turbo Trails 3D Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - colorful-arcade-game
    paths:
      - "turbo-trails-godot/**"
      - ".github/workflows/turbo-trails-godot.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Validate 3D game and export Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GODOT_VERSION: "4.7.2"
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout game source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licences
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1" "cmdline-tools;latest"

      - name: Download Godot 4.7.2 editor
        run: |
          mkdir -p "$RUNNER_TEMP/godot-editor"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -o "$RUNNER_TEMP/godot-editor.zip"
          unzip -q "$RUNNER_TEMP/godot-editor.zip" -d "$RUNNER_TEMP/godot-editor"
          find "$RUNNER_TEMP/godot-editor" -maxdepth 2 -type f -name 'Godot_v4.7.2-stable_linux.x86_64' -exec chmod +x {} \;
          echo "GODOT_BIN=$(find "$RUNNER_TEMP/godot-editor" -type f -name 'Godot_v4.7.2-stable_linux.x86_64' -print -quit)" >> "$GITHUB_ENV"

      - name: Restore Android export templates
        id: godot-template-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-4.7.2-stable-android-templates-v1

      - name: Download Android export templates
        if: steps.godot-template-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" \
            -o "$RUNNER_TEMP/godot-export-templates.tpz"
          unzip -p "$RUNNER_TEMP/godot-export-templates.tpz" templates/android_debug.apk \
            > "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"
          unzip -p "$RUNNER_TEMP/godot-export-templates.tpz" templates/android_release.apk \
            > "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_release.apk"
          unzip -p "$RUNNER_TEMP/godot-export-templates.tpz" templates/android_source.zip \
            > "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_source.zip"
          test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"
          test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_release.apk"

      - name: Configure Godot Android SDK paths and debug keystore
        run: |
          mkdir -p "$HOME/.config/godot" "$RUNNER_TEMP"
          # Reuse the repository's existing CI debug certificate so each APK
          # remains installable as an update to the previous Turbo Trails APK.
          base64 --decode ci/audiophile-debug.keystore.b64 > "$RUNNER_TEMP/android-debug.keystore"
          keytool -list -keystore "$RUNNER_TEMP/android-debug.keystore" \
            -storepass audiophile-debug -alias audiophile-debug
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF

      - name: Download and stage free CC0 game assets
        working-directory: turbo-trails-godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/vehicles assets/textures
          # Detailed Spectral GT RS sports car, dedicated CC0 1.0 by its author.
          curl --fail --location --retry 3 --retry-delay 2 "https://raw.githubusercontent.com/JaronKBragg7337/spectral-gt-rs/main/spectral_gt_rs_game_ready.glb" -o assets/vehicles/spectral_gt_rs_game_ready.glb
          test "$(stat -c %s assets/vehicles/spectral_gt_rs_game_ready.glb)" -gt 1000000
          # Poly Haven Asphalt Track PBR texture maps, downloaded at mobile-friendly 1K.
          curl --fail --location --retry 3 --retry-delay 2 -H "User-Agent: TurboTrails3D-AssetImporter/1.0" "https://api.polyhaven.com/files/asphalt_track" -o "$RUNNER_TEMP/asphalt-track-files.json"
          DIFFUSE_URL="$(jq -r '.Diffuse["1k"].jpg.url // .diffuse["1k"].jpg.url // empty' "$RUNNER_TEMP/asphalt-track-files.json")"
          NORMAL_URL="$(jq -r '.nor_gl["1k"].jpg.url // .nor_gl["1k"].png.url // .NormalGL["1k"].jpg.url // empty' "$RUNNER_TEMP/asphalt-track-files.json")"
          ROUGH_URL="$(jq -r '.Rough["1k"].jpg.url // .rough["1k"].jpg.url // empty' "$RUNNER_TEMP/asphalt-track-files.json")"
          test -n "$DIFFUSE_URL"
          curl --fail --location --retry 3 --retry-delay 2 "$DIFFUSE_URL" -o assets/textures/asphalt_track_diffuse.jpg
          if [ -n "$NORMAL_URL" ]; then curl --fail --location --retry 3 --retry-delay 2 "$NORMAL_URL" -o assets/textures/asphalt_track_normal.jpg; fi
          if [ -n "$ROUGH_URL" ]; then curl --fail --location --retry 3 --retry-delay 2 "$ROUGH_URL" -o assets/textures/asphalt_track_roughness.jpg; fi
          cat > assets/ASSET_CREDITS.md <<'EOF'
          # Turbo Trails 3D — third-party assets
          - Spectral GT RS detailed sports car: JaronKBragg7337, CC0 1.0 Universal.
            Source: https://github.com/JaronKBragg7337/spectral-gt-rs
          - Asphalt Track PBR maps: Poly Haven, CC0.
            Source: https://polyhaven.com/a/asphalt_track
          - Assets are downloaded during the Android build and packed into the APK.
          EOF
          du -h assets/vehicles/* assets/textures/*

      - name: Validate project and GDScript
        working-directory: turbo-trails-godot
        run: |
          "$GODOT_BIN" --version
          "$GODOT_BIN" --headless --editor --path . --import --quit
          "$GODOT_BIN" --headless --path . --quit-after 8

      - name: Install virtual display and software renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri

      - name: Smoke test actual rendering and steering controls
        working-directory: turbo-trails-godot
        env:
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 "$GODOT_BIN" --audio-driver Dummy --path . --script res://scripts/smoke_test.gd
          test -s "$GITHUB_WORKSPACE/turbo-trails-render-smoke.png"

      - name: Export signed Android APK
        working-directory: turbo-trails-godot
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/android-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: audiophile-debug
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: audiophile-debug
        run: |
          mkdir -p build
          "$GODOT_BIN" --headless --path . --export-debug "Android" build/Turbo-Trails-3D-debug.apk
          test -s build/Turbo-Trails-3D-debug.apk
          unzip -t build/Turbo-Trails-3D-debug.apk | tail -n 2
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose build/Turbo-Trails-3D-debug.apk

      - name: Upload 3D game APK
        uses: actions/upload-artifact@v4
        with:
          name: Turbo-Trails-3D-debug-APK
          path: turbo-trails-godot/build/Turbo-Trails-3D-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload actual rendered-frame evidence
        uses: actions/upload-artifact@v4
        with:
          name: Turbo-Trails-render-smoke
          path: turbo-trails-render-smoke.png
          if-no-files-found: error
          retention-days: 14
