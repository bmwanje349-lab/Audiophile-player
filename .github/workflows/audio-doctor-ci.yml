name: Audio Doctor Studio CI

on:
  pull_request:
    paths:
      - "audio-doctor/**"
      - ".github/workflows/audio-doctor-ci.yml"
  push:
    branches: [main]
    paths:
      - "audio-doctor/**"
      - ".github/workflows/audio-doctor-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: audio-doctor/requirements.txt
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: python -m pip install -r audio-doctor/requirements.txt
      - name: Compile Python files
        run: python -m py_compile audio-doctor/audio_doctor.py audio-doctor/server.py
      - name: Run engine tests
        run: |
          cd audio-doctor
          python -m unittest discover -s tests -v
      - name: Check dashboard JavaScript syntax
        run: |
          python - <<PY
          import re
          from pathlib import Path
          page = Path("audio-doctor/web/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", page, flags=re.S)
          assert scripts, "No inline JavaScript found"
          Path("/tmp/audio-doctor-ui.js").write_text(scripts[-1], encoding="utf-8")
          PY
          node --check /tmp/audio-doctor-ui.js
      - name: Check CLI entry point
        run: python audio-doctor/audio_doctor.py --help
