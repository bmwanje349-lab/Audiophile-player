name: Turbo Trails Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - colorful-arcade-game
    paths:
      - "arcade-game/**"
      - ".github/workflows/turbo-trails-android.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build standalone Android game
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arcade-game
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Turbo-Trails-debug-APK
          path: arcade-game/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
