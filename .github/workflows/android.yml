name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: |
          sdkmanager             "platforms;android-36"             "build-tools;35.0.0"             "cmake;3.22.1"             "ndk;27.3.13750724"

      - name: Fetch and verify exact MDX ONNX model
        run: |
          set -euo pipefail
          MODEL_DIR="app/src/main/assets/models/mdx"
          MODEL_FILE="UVR_MDXNET_9482.onnx"
          MODEL_URL="https://github.com/k2-fsa/sherpa-onnx/releases/download/source-separation-models/UVR_MDXNET_9482.onnx"
          MODEL_SHA256="f4f365207c56deb115bceedff3ad8fe98a751c745f9e370cecec6226b8b47184"

          mkdir -p "$MODEL_DIR"
          curl --fail --location --retry 5 --retry-delay 3             -A "AudiophilePlayer/MDX-ONNX-build"             -o "$MODEL_DIR/$MODEL_FILE.part"             "$MODEL_URL"

          echo "$MODEL_SHA256  $MODEL_DIR/$MODEL_FILE.part" | sha256sum -c -
          test "$(stat -c%s "$MODEL_DIR/$MODEL_FILE.part")" -gt 1000000
          mv "$MODEL_DIR/$MODEL_FILE.part" "$MODEL_DIR/$MODEL_FILE"

          echo "Verified model:"
          sha256sum "$MODEL_DIR/$MODEL_FILE"
          ls -lh "$MODEL_DIR/$MODEL_FILE"

      - name: Real ONNX model contract smoke test
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir onnxruntime numpy
          MDX_MODEL="$PWD/app/src/main/assets/models/mdx/UVR_MDXNET_9482.onnx"             python3 mdx_model_smoke.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Show project layout
        run: |
          pwd
          ls -la
          echo "--- app folder ---"
          ls -la app || echo "NO app FOLDER"
          echo "--- model asset ---"
          ls -lh app/src/main/assets/models/mdx || echo "NO MDX MODEL ASSET"
          echo "--- app/build.gradle.kts (first 16 lines) ---"
          head -16 app/build.gradle.kts || echo "NO app/build.gradle.kts"
          echo "--- settings ---"
          cat settings.gradle.kts
          echo "--- all build files ---"
          find . -name "build.gradle*" -not -path "./.git/*"
          echo "--- gradle projects ---"
          gradle projects --console=plain --no-daemon
          echo "--- app tasks ---"
          gradle :app:tasks --all --console=plain --no-daemon

      - name: Build Debug APK
        run: |
          set -euo pipefail
          set +e
          gradle :app:assembleDebug             --console=plain             --stacktrace             --no-daemon             > build.log 2>&1
          status=$?
          cat build.log
          echo "=================== ERROR SUMMARY ==================="
          grep -n -E             "^e: |What went wrong|error:|CMake Error|Execution failed|> .*(not found|Unresolved|Could not)"             -A4             build.log | head -80 || true
          echo "======================================================"
          exit "$status"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
