name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-model:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.model.outputs.available }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify vendored exact MDX ONNX model
        id: model
        shell: bash
        run: |
          set -euo pipefail
          MODEL="app/src/main/assets/models/mdx/UVR_MDXNET_9482.onnx"
          SHA="f4f365207c56deb115bceedff3ad8fe98a751c745f9e370cecec6226b8b47184"

          if [ ! -f "$MODEL" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "MDX model is not vendored yet. The model-vendor workflow will bootstrap it on main."
            exit 0
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"
          test "$(stat -c%s "$MODEL")" -gt 1000000
          echo "$SHA  $MODEL" | sha256sum -c -
          sha256sum "$MODEL"
          ls -lh "$MODEL"

  build:
    needs: check-model
    if: needs.check-model.outputs.available == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: |
          sdkmanager             "platforms;android-36"             "build-tools;35.0.0"             "cmake;3.22.1"             "ndk;27.3.13750724"

      - name: Real ONNX model contract smoke test
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir onnxruntime numpy
          MDX_MODEL="$PWD/app/src/main/assets/models/mdx/UVR_MDXNET_9482.onnx"             python3 mdx_model_smoke.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Verify pinned Gradle wrapper
        run: ./gradlew --version

      - name: Show project layout
        run: |
          pwd
          ls -la
          echo "--- app folder ---"
          ls -la app || echo "NO app FOLDER"
          echo "--- model asset ---"
          ls -lh app/src/main/assets/models/mdx
          echo "--- app/build.gradle.kts (first 16 lines) ---"
          head -16 app/build.gradle.kts
          echo "--- settings ---"
          cat settings.gradle.kts
          echo "--- all build files ---"
          find . -name "build.gradle*" -not -path "./.git/*"
          echo "--- ./gradlew projects ---"
          ./gradlew projects --console=plain --no-daemon
          echo "--- app tasks ---"
          ./gradlew :app:tasks --all --console=plain --no-daemon

      - name: Verify critical Android wiring
        run: |
          set -euo pipefail
          grep -Fq 'android:name=".livekaraoke.LiveKaraokeService"' app/src/main/AndroidManifest.xml
          ! grep -Fq 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          grep -Fq 'ci/audiophile-debug.keystore' app/build.gradle.kts
          grep -Fq 'ci/audiophile-debug.keystore.b64' app/build.gradle.kts
          test -f ci/audiophile-debug.keystore.b64

      - name: Run JVM streaming regression tests
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest --console=plain --stacktrace --no-daemon

      - name: Build Debug APK
        run: |
          set -euo pipefail
          set +e
          ./gradlew :app:assembleDebug             --console=plain             --stacktrace             --no-daemon             > build.log 2>&1
          status=$?
          cat build.log
          echo "=================== ERROR SUMMARY ==================="
          grep -n -E             "^e: |What went wrong|error:|CMake Error|Execution failed|> .*(not found|Unresolved|Could not)"             -A4 build.log | head -80 || true
          echo "======================================================"
          exit "$status"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Verify Debug APK payload
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          python3 - <<'PY'
          import hashlib, zipfile
          apk="app/build/outputs/apk/debug/app-debug.apk"
          model_sha="f4f365207c56deb115bceedff3ad8fe98a751c745f9e370cecec6226b8b47184"
          model_size=29704436
          with zipfile.ZipFile(apk) as z:
              names=set(z.namelist())
              model="assets/models/mdx/UVR_MDXNET_9482.onnx"
              assert model in names, "bundled MDX model missing from APK"
              data=z.read(model)
              assert len(data)==model_size, f"model size {len(data)} != {model_size}"
              assert hashlib.sha256(data).hexdigest()==model_sha, "bundled MDX model SHA-256 mismatch"
              for abi in ("arm64-v8a","armeabi-v7a","x86_64"):
                  assert f"lib/{abi}/libaudiophile_vocal_remover.so" in names, f"vocal JNI missing for {abi}"
                  assert f"lib/{abi}/libonnxruntime.so" in names or any(
                      n.startswith(f"lib/{abi}/") and "onnxruntime" in n for n in names
                  ), f"ONNX Runtime native library missing for {abi}"
          print("APK payload verification passed")
          PY
          unzip -t "$APK" >/dev/null
          EXPECTED_CERT="0ed92464fd40ef0ad106cbaf2e4cd5aebb55e388bb77123d2504f8fed1208b9e"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" > certs.txt
          cat certs.txt
          ACTUAL_CERT="$(sed -nE 's/.*SHA-256 digest: *([0-9A-Fa-f:]+).*/\1/p' certs.txt | head -1 | tr -d ':')"
          test -n "$ACTUAL_CERT"
          test "$(printf '%s' "$ACTUAL_CERT" | tr '[:upper:]' '[:lower:]')" = "$EXPECTED_CERT"
          echo "Stable CI debug certificate verification passed"

      - name: Build CI-signed Release APK
        run: |
          set -euo pipefail
          ./gradlew :app:assembleCiRelease --console=plain --stacktrace --no-daemon

      - name: Verify CI Release APK payload and signature
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/ciRelease/app-ciRelease.apk"
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          EXPECTED_CERT="0ed92464fd40ef0ad106cbaf2e4cd5aebb55e388bb77123d2504f8fed1208b9e"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" > ci-release-certs.txt
          cat ci-release-certs.txt
          ACTUAL_CERT="$(sed -nE 's/.*SHA-256 digest: *([0-9A-Fa-f:]+).*/\1/p' ci-release-certs.txt | head -1 | tr -d ':')"
          test -n "$ACTUAL_CERT"
          test "$(printf '%s' "$ACTUAL_CERT" | tr '[:upper:]' '[:lower:]')" = "$EXPECTED_CERT"
          echo "CI release certificate verification passed"

      - name: Upload CI Release APK
        uses: actions/upload-artifact@v7
        with:
          name: app-ci-release
          path: app/build/outputs/apk/ciRelease/app-ciRelease.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn


  production-release:
    needs: check-model
    if: needs.check-model.outputs.available == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check production signing secrets
        id: signing
        shell: bash
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_B64" ] &&
             [ -n "$RELEASE_STORE_PASSWORD" ] &&
             [ -n "$RELEASE_KEY_ALIAS" ] &&
             [ -n "$RELEASE_KEY_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Production signing secrets are not configured; the production APK is intentionally not built."
          fi

      - name: Set up JDK 17
        if: steps.signing.outputs.configured == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: steps.signing.outputs.configured == 'true'
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android build dependencies
        if: steps.signing.outputs.configured == 'true'
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.3.13750724"

      - name: Set up Gradle
        if: steps.signing.outputs.configured == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Build production-signed Release APK
        if: steps.signing.outputs.configured == 'true'
        env:
          ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --console=plain --stacktrace --no-daemon

      - name: Verify production signature
        if: steps.signing.outputs.configured == 'true'
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Upload production Release APK
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: app-production-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  runtime-smoke:
    timeout-minutes: 30
    needs:
      - check-model
      - build
    if: needs.check-model.outputs.available == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android build dependencies
        run: |
          set -euo pipefail
          sdkmanager             "platforms;android-36"             "build-tools;35.0.0"             "cmake;3.22.1"             "ndk;27.3.13750724"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Verify pinned Gradle wrapper
        run: ./gradlew --version

      - name: Enable KVM access for the Android emulator
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -e /dev/kvm ]]; then
            echo "::error::This runner does not expose /dev/kvm. The x86_64 Android emulator requires hardware virtualization."
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm

      - name: Run Android runtime smoke tests on API 35
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          force-avd-creation: true
          emulator-boot-timeout: 600
          disable-linux-hw-accel: auto
          disable-animations: true
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -no-snapshot
            -noaudio
            -no-boot-anim
            -camera-back none
            -camera-front none
          script: |
            set +e
            ./gradlew :app:connectedDebugAndroidTest               --console=plain               --stacktrace               --no-daemon               --max-workers=2
            status=$?

            echo "===== EMULATOR STATE ====="
            adb -s "${EMULATOR_PORT:-5554}" shell getprop ro.build.version.sdk || true
            adb -s "${EMULATOR_PORT:-5554}" shell getprop sys.boot_completed || true

            echo "===== TEST LOGCAT (tail) ====="
            adb -s "${EMULATOR_PORT:-5554}" logcat -d -t 20000 || true

            exit "$status"
