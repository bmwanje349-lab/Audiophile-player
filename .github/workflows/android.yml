name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.3.13750724"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Show project layout
        run: |
          pwd
          ls -la
          echo "--- app folder ---"
          ls -la app || echo "NO app FOLDER"
          echo "--- app/build.gradle.kts (first 12 lines) ---"
          head -12 app/build.gradle.kts || echo "NO app/build.gradle.kts"
          echo "--- settings ---"
          cat settings.gradle.kts
          echo "--- all build files ---"
          find . -name "build.gradle*" -not -path "./.git/*"
          echo "--- gradle projects ---"
          gradle projects --console=plain --no-daemon
          echo "--- app tasks ---"
          gradle :app:tasks --all --console=plain --no-daemon

      - name: Build Debug APK
        run: |
          set +e
          gradle :app:assembleDebug \
            --console=plain \
            --stacktrace \
            --no-daemon \
            2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "=================== ERROR SUMMARY ==================="
          grep -n -E \
            "^e: |What went wrong|error:|CMake Error|Execution failed|> .*(not found|Unresolved|Could not)" \
            -A4 \
            build.log | head -80
          echo "======================================================"
          exit "$status"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
