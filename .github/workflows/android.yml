name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify vendored exact MDX ONNX model
        shell: bash
        run: |
          set -euo pipefail
          MODEL="app/src/main/assets/models/mdx/UVR_MDXNET_9482.onnx"
          SHA="f4f365207c56deb115bceedff3ad8fe98a751c745f9e370cecec6226b8b47184"

          test -f "$MODEL" || {
            echo "::error::The exact pinned MDX-Net 9482 model is missing from the repository."
            exit 1
          }

          test "$(stat -c%s "$MODEL")" -gt 1000000
          echo "$SHA  $MODEL" | sha256sum -c -
          sha256sum "$MODEL"
          ls -lh "$MODEL"

  build:
    needs: check-model
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: |
          sdkmanager             "platforms;android-36"             "build-tools;35.0.0"             "cmake;3.22.1"             "ndk;27.3.13750724"

      - name: Real ONNX model contract smoke test
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir onnxruntime numpy
          MDX_MODEL="$PWD/app/src/main/assets/models/mdx/UVR_MDXNET_9482.onnx"             python3 mdx_model_smoke.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Show project layout
        run: |
          pwd
          ls -la
          echo "--- app folder ---"
          ls -la app || echo "NO app FOLDER"
          echo "--- model asset ---"
          ls -lh app/src/main/assets/models/mdx
          echo "--- app/build.gradle.kts (first 16 lines) ---"
          head -16 app/build.gradle.kts
          echo "--- settings ---"
          cat settings.gradle.kts
          echo "--- all build files ---"
          find . -name "build.gradle*" -not -path "./.git/*"
          echo "--- gradle projects ---"
          gradle projects --console=plain --no-daemon
          echo "--- app tasks ---"
          gradle :app:tasks --all --console=plain --no-daemon

      - name: Verify critical Android wiring
        run: |
          set -euo pipefail
          grep -Fq 'android:name=".livekaraoke.LiveKaraokeService"' app/src/main/AndroidManifest.xml
          ! grep -Fq 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          grep -Fq 'ci/audiophile-debug.keystore' app/build.gradle.kts
          grep -Fq 'ci/audiophile-debug.keystore.b64' app/build.gradle.kts
          test -f ci/audiophile-debug.keystore.b64

      - name: Run JVM streaming regression tests
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest --console=plain --stacktrace --no-daemon

      - name: Build Debug APK
        run: |
          set -euo pipefail
          set +e
          gradle :app:assembleDebug             --console=plain             --stacktrace             --no-daemon             > build.log 2>&1
          status=$?
          cat build.log
          echo "=================== ERROR SUMMARY ==================="
          grep -n -E             "^e: |What went wrong|error:|CMake Error|Execution failed|> .*(not found|Unresolved|Could not)"             -A4 build.log | head -80 || true
          echo "======================================================"
          exit "$status"

      - name: Run Android instrumentation smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 15
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 4096M
          disk-size: 8G
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -euo pipefail
            gradle :app:connectedDebugAndroidTest --console=plain --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Verify Debug APK payload
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          python3 - <<'PY'
          import hashlib, zipfile
          apk="app/build/outputs/apk/debug/app-debug.apk"
          model_sha="f4f365207c56deb115bceedff3ad8fe98a751c745f9e370cecec6226b8b47184"
          model_size=29704436
          with zipfile.ZipFile(apk) as z:
              names=set(z.namelist())
              model="assets/models/mdx/UVR_MDXNET_9482.onnx"
              assert model in names, "bundled MDX model missing from APK"
              data=z.read(model)
              assert len(data)==model_size, f"model size {len(data)} != {model_size}"
              assert hashlib.sha256(data).hexdigest()==model_sha, "bundled MDX model SHA-256 mismatch"
              for abi in ("arm64-v8a","armeabi-v7a","x86_64"):
                  assert f"lib/{abi}/libaudiophile_vocal_remover.so" in names, f"vocal JNI missing for {abi}"
                  assert f"lib/{abi}/libonnxruntime.so" in names or any(
                      n.startswith(f"lib/{abi}/") and "onnxruntime" in n for n in names
                  ), f"ONNX Runtime native library missing for {abi}"
          print("APK payload verification passed")
          PY
          unzip -t "$APK" >/dev/null
          EXPECTED_CERT="0ed92464fd40ef0ad106cbaf2e4cd5aebb55e388bb77123d2504f8fed1208b9e"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" > certs.txt
          cat certs.txt
          ACTUAL_CERT="$(sed -nE 's/.*SHA-256 digest: *([0-9A-Fa-f:]+).*/\1/p' certs.txt | head -1 | tr -d ':')"
          test -n "$ACTUAL_CERT"
          test "$(printf '%s' "$ACTUAL_CERT" | tr '[:upper:]' '[:lower:]')" = "$EXPECTED_CERT"
          echo "Stable CI debug certificate verification passed"

      - name: Build signed Release APK
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --console=plain --stacktrace --no-daemon

      - name: Verify Release APK payload and CI/test signature
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          EXPECTED_CERT="0ed92464fd40ef0ad106cbaf2e4cd5aebb55e388bb77123d2504f8fed1208b9e"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" > release-certs.txt
          cat release-certs.txt
          ACTUAL_CERT="$(sed -nE 's/.*SHA-256 digest: *([0-9A-Fa-f:]+).*/\1/p' release-certs.txt | head -1 | tr -d ':')"
          test -n "$ACTUAL_CERT"
          test "$(printf '%s' "$ACTUAL_CERT" | tr '[:upper:]' '[:lower:]')" = "$EXPECTED_CERT"
          echo "CI/test-signed release certificate verification passed. Configure ANDROID_RELEASE_* secrets for production distribution signing."

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
