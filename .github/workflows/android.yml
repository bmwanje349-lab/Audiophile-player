name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.3.13750724"

      - name: Package verified MDX model
        run: |
          set -euo pipefail

          MODEL_DIR="app/src/main/assets/models/mdx"
          MODEL_FILE="UVR_MDXNET_9482.fp16acc.tflite"
          MODEL_SHA256="2a07e11db13a11ca4900a54b4a316ef67931e993a6a3d19444bccbbeb9b445ee"
          MODEL_REVISION="05028818488250752f150d9ff8f75f5f012691f7"

          mkdir -p "$MODEL_DIR"

          python -m pip install --disable-pip-version-check --upgrade \
            "huggingface_hub>=0.32.0" \
            "hf-xet"

          python - <<'PY'
          from pathlib import Path
          from huggingface_hub import hf_hub_download

          model_dir = Path("app/src/main/assets/models/mdx")
          model_file = "UVR_MDXNET_9482.fp16acc.tflite"
          revision = "05028818488250752f150d9ff8f75f5f012691f7"

          cached = hf_hub_download(
              repo_id="gyoom-sa/UVR-MDX-LiteRT",
              filename=model_file,
              revision=revision,
          )

          dst = model_dir / model_file
          dst.write_bytes(Path(cached).read_bytes())
          print(f"Copied {cached} -> {dst}")
          PY

          echo "$MODEL_SHA256  $MODEL_DIR/$MODEL_FILE" | sha256sum -c -
          test "$(stat -c%s "$MODEL_DIR/$MODEL_FILE")" -gt 1000000

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Show project layout
        run: |
          pwd
          ls -la

          echo "--- app folder ---"
          ls -la app || echo "NO app FOLDER"

          echo "--- app/build.gradle.kts (first 12 lines) ---"
          head -12 app/build.gradle.kts || echo "NO app/build.gradle.kts"

          echo "--- settings ---"
          cat settings.gradle.kts

          echo "--- all build files ---"
          find . -name "build.gradle*" -not -path "./.git/*"

          echo "--- gradle projects ---"
          gradle projects --console=plain --no-daemon

          echo "--- app tasks ---"
          gradle :app:tasks --all --console=plain --no-daemon

      - name: Build Debug APK
        run: |
          set +e

          gradle :app:assembleDebug \
            --console=plain \
            --stacktrace \
            --no-daemon \
            2>&1 | tee build.log

          status=${PIPESTATUS[0]}

          echo "=================== ERROR SUMMARY ==================="

          grep -n -E \
            "^e: |What went wrong|error:|CMake Error|Execution failed|> .*(not found|Unresolved|Could not)" \
            -A4 \
            build.log | head -80

          echo "======================================================"

          exit "$status"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
