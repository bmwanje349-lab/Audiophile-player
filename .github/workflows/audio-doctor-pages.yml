name: Audio Doctor Studio Pages

on:
  push:
    branches: [main]
    paths:
      - "audio-doctor/web/**"
      - ".github/workflows/audio-doctor-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Package dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: audio-doctor/web
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
