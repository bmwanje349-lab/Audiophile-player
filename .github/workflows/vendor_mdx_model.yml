name: Vendor MDX ONNX model

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vendor-mdx-main
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Vendor exact pinned ONNX model
        shell: bash
        run: |
          set -euo pipefail

          MODEL_DIR="app/src/main/assets/models/mdx"
          MODEL_FILE="UVR_MDXNET_9482.onnx"
          MODEL_PATH="$MODEL_DIR/$MODEL_FILE"
          MODEL_URL="https://huggingface.co/seanghay/uvr_models/resolve/main/UVR_MDXNET_9482.onnx?download=true"
          MODEL_SHA256="f4f365207c56deb115bceedff3ad8fe98a751c745f9e370cecec6226b8b47184"

          mkdir -p "$MODEL_DIR"

          if [ -f "$MODEL_PATH" ]; then
            echo "Model already vendored."
            echo "$MODEL_SHA256  $MODEL_PATH" | sha256sum -c -
            exit 0
          fi

          curl --fail --location --retry 5 --retry-delay 3             -A "AudiophilePlayer/MDX-ONNX-vendor"             -o "$MODEL_PATH.part"             "$MODEL_URL"

          echo "$MODEL_SHA256  $MODEL_PATH.part" | sha256sum -c -
          test "$(stat -c%s "$MODEL_PATH.part")" -gt 1000000
          mv "$MODEL_PATH.part" "$MODEL_PATH"

          echo "Vendored model:"
          sha256sum "$MODEL_PATH"
          ls -lh "$MODEL_PATH"

      - name: Commit vendored model to main
        shell: bash
        run: |
          set -euo pipefail
          MODEL="app/src/main/assets/models/mdx/UVR_MDXNET_9482.onnx"

          if git diff --quiet -- "$MODEL"; then
            echo "No model commit needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MODEL"
          git commit -m "Vendor exact MDX-Net 9482 ONNX model"
          git push origin HEAD:main
