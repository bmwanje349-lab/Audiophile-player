name: Audio Doctor Studio APK

on:
  push:
    branches:
      - standalone-audio-doctor-android
    paths:
      - "audio-doctor-android/**"
      - ".github/workflows/audio-doctor-android.yml"
  pull_request:
    paths:
      - "audio-doctor-android/**"
      - ".github/workflows/audio-doctor-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build standalone Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compile and run DSP math tests
        run: gradle -p audio-doctor-android --no-daemon --stacktrace testDebugUnitTest

      - name: Build standalone debug APK
        run: gradle -p audio-doctor-android --no-daemon --stacktrace assembleDebug

      - name: Verify app identity and absence of player code
        shell: bash
        run: |
          set -euo pipefail
          APK="audio-doctor-android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.example.audiodoctor'"
          MANIFEST="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK")"
          if printf '%s' "$MANIFEST" | grep -q 'android.permission.INTERNET'; then
            echo "Unexpected internet permission in offline analysis app."
            exit 1
          fi
          while read -r DEX; do
            if unzip -p "$APK" "$DEX" | strings | grep -q 'com/example/musicplayer'; then
              echo "Audiophile Player package reference detected in the APK."
              exit 1
            fi
          done < <(unzip -Z1 "$APK" | grep -E '^classes[0-9]*\.dex$' || true)
          echo "Standalone package verified. APK bytes: $(stat -c%s "$APK")"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: audio-doctor-studio-debug-apk
          path: audio-doctor-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-doctor-studio-test-results
          path: audio-doctor-android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
