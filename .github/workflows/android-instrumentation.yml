name: Android Instrumentation (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instrumentation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android build dependencies
        run: |
          set -euo pipefail
          sdkmanager             "platforms;android-36"             "build-tools;35.0.0"             "cmake;3.22.1"             "ndk;27.3.13750724"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run real Android MDX/Karaoke instrumentation
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          force-avd-creation: true
          emulator-boot-timeout: 1200
          disable-linux-hw-accel: false
          disable-animations: true
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -no-snapshot
            -noaudio
            -no-boot-anim
            -camera-back none
            -camera-front none
          script: |
            set +e
            gradle :app:connectedDebugAndroidTest               --console=plain               --stacktrace               --no-daemon               --max-workers=2
            status=$?

            echo "===== EMULATOR STATE ====="
            adb -s "${EMULATOR_PORT:-5554}" shell getprop ro.build.version.sdk || true
            adb -s "${EMULATOR_PORT:-5554}" shell getprop sys.boot_completed || true

            echo "===== TEST LOGCAT (tail) ====="
            adb -s "${EMULATOR_PORT:-5554}" logcat -d -t 20000 || true

            exit "$status"
