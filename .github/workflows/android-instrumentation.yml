name: Android Instrumentation (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android build dependencies
        run: |
          set -euo pipefail
          sdkmanager             "platforms;android-36"             "build-tools;35.0.0"             "cmake;3.22.1"             "ndk;27.3.13750724"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Verify pinned Gradle wrapper
        run: ./gradlew --version

      - name: Enable KVM access for the Android emulator
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -e /dev/kvm ]]; then
            echo "::error::This runner does not expose /dev/kvm. The x86_64 Android emulator requires hardware virtualization."
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm

      - name: Run real Android MDX/Karaoke instrumentation
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          force-avd-creation: true
          emulator-boot-timeout: 600
          disable-linux-hw-accel: auto
          disable-animations: true
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -no-snapshot
            -noaudio
            -no-boot-anim
            -camera-back none
            -camera-front none
          script: |
            set +e
            ./gradlew :app:connectedDebugAndroidTest               --console=plain               --stacktrace               --no-daemon               --max-workers=2
            status=$?

            echo "===== EMULATOR STATE ====="
            adb -s "emulator-${EMULATOR_PORT:-5554}" shell getprop ro.build.version.sdk || true
            adb -s "emulator-${EMULATOR_PORT:-5554}" shell getprop sys.boot_completed || true

            echo "===== TEST LOGCAT (tail) ====="
            adb -s "emulator-${EMULATOR_PORT:-5554}" logcat -d -t 20000 || true

            exit "$status"
